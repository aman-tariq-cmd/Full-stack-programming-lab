version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: crm-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: crm-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/crm_db
      - JWT_SECRET=your_jwt_secret_key_here
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo

  client:
    build: ./client
    container_name: crm-client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  mongo-data: